name: Fantrax Yearly Renewals
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Discover only, capture one sport for preview, or apply eligible automatic policies
        type: choice
        default: discover
        options: [discover, preview, automatic]
      sport:
        description: Sport to capture in preview mode
        type: choice
        default: MLB
        options: [NFL, MLB, NBA, EPL, PGA]
  schedule:
    - cron: '0 3 * * *'
      timezone: America/New_York
permissions:
  contents: write
concurrency:
  group: fantrax-data-update
  cancel-in-progress: false
jobs:
  renewals:
    if: vars.FANTRAX_RENEWALS_ENABLED == 'true'
    environment: fantrax-renewals
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRADE_ROSTER_PROJECT_REF: ${{ vars.TRADE_ROSTER_PROJECT_REF }}
      TRADE_ROSTER_DATABASE_URL: ${{ secrets.TRADE_ROSTER_DATABASE_URL }}
      TRADE_ROSTER_CA_CERT: ${{ secrets.TRADE_ROSTER_CA_CERT }}
      FANTRAX_RENEWAL_CONFIRM: ${{ vars.FANTRAX_RENEWAL_PROJECT_REF }}
      RENEWAL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'automatic' }}
      RENEWAL_SPORT: ${{ inputs.sport || 'MLB' }}
    steps:
      - name: Set runtime connection file
        run: echo "FANTRAX_CONNECTIONS_FILE=$RUNNER_TEMP/fantrax-runtime.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
        working-directory: supabase/tests
      - name: Resolve database-approved connections
        run: node supabase/tests/yearly-renewals.mjs export "$FANTRAX_CONNECTIONS_FILE"
      - name: Discover and capture eligible renewals
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
          FANTRAX_USER_SECRET_ID: ${{ secrets.FANTRAX_USER_SECRET_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/renewals"
          if [ "$RENEWAL_MODE" = preview ]; then
            python scripts/yearly_renewals.py --directory "$RUNNER_TEMP/renewals" --capture "$RENEWAL_SPORT"
          elif [ "$RENEWAL_MODE" = automatic ]; then
            python scripts/yearly_renewals.py --directory "$RUNNER_TEMP/renewals" --capture automatic
          else
            python scripts/yearly_renewals.py --directory "$RUNNER_TEMP/renewals"
          fi
      - name: Preview captured plans
        run: |
          for sport in NFL MLB NBA EPL PGA; do
            if [ -f "$RUNNER_TEMP/renewals/$sport-capture.json" ]; then
              node supabase/tests/yearly-renewals.mjs preview "$RUNNER_TEMP/renewals/$sport-capture.json" > "$RUNNER_TEMP/renewals/$sport-preview.json"
            fi
          done
      - name: Archive renewed sports before changing connections
        if: env.RENEWAL_MODE == 'automatic'
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          python scripts/archive_renewed_sports.py --directory "$RUNNER_TEMP/renewals"
          git add -- web/data/history
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive completed sport standings on Fantrax renewal"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Apply only explicitly enabled automatic policies
        if: env.RENEWAL_MODE == 'automatic'
        run: node supabase/tests/yearly-renewals.mjs automatic "$RUNNER_TEMP/renewals"
      - name: Save evidence and preview reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantrax-renewal-evidence
          path: ${{ runner.temp }}/renewals/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run summary
        if: always()
        run: |
          echo "## Fantrax renewal run" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: $RENEWAL_MODE. Download the evidence artifact for discovery, captures, and preview blockers. Standings switch only with a separately approved archive hash in policy." >> "$GITHUB_STEP_SUMMARY"
          echo "Fresh old-league standings are archived and pushed before roster activation. Standings connections still wait for separate release. Archive or push failure prevents activation. Inspect job logs before retrying." >> "$GITHUB_STEP_SUMMARY"
