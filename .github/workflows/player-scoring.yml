name: Collect player scoring
on:
  workflow_dispatch:
  schedule:
    - cron: '33 1 * * *'
      timezone: America/New_York
permissions:
  contents: read
concurrency:
  group: player-scoring-import
  cancel-in-progress: false
jobs:
  scoring:
    if: vars.SCORING_IMPORTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - working-directory: supabase/tests
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - name: Collect approved daily and tournament scoring
        env:
          TRADE_ROSTER_PROJECT_REF: ${{ vars.TRADE_ROSTER_PROJECT_REF }}
          SCORING_PROJECT_CONFIRM: ${{ vars.SCORING_PROJECT_CONFIRM }}
          TRADE_ROSTER_DATABASE_URL: ${{ secrets.TRADE_ROSTER_DATABASE_URL }}
          TRADE_ROSTER_CA_CERT: ${{ secrets.TRADE_ROSTER_CA_CERT }}
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: node supabase/tests/run-scheduled-scoring.mjs --run

