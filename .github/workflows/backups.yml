name: Encrypted league backups
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: preview
        options: [preview, manual, daily, drafts, retention-preview]
  schedule:
    - cron: '45 3 * * *'
      timezone: America/New_York
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: pentagon-backups
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '45 3 * * *' || vars.DRAFT_BACKUPS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKUP_PROJECT_CONFIRM: ${{ vars.BACKUP_PROJECT_CONFIRM }}
      TRADE_ROSTER_PROJECT_REF: ${{ vars.TRADE_ROSTER_PROJECT_REF }}
      TRADE_ROSTER_DATABASE_URL: ${{ secrets.TRADE_ROSTER_DATABASE_URL }}
      TRADE_ROSTER_CA_CERT: ${{ secrets.TRADE_ROSTER_CA_CERT }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      BACKUP_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '45 3 * * *' && 'daily' || 'drafts') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install export tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pentagon-pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          python -m pip install awscli
      - working-directory: supabase/tests
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - name: Export or preview
        shell: bash
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          if [ "$BACKUP_MODE" = retention-preview ]; then
            node supabase/tests/backup-retention.mjs --preview
          else
            node supabase/tests/run-backup.mjs "--$BACKUP_MODE"
          fi
      - name: Apply retention after successful daily upload
        if: env.BACKUP_MODE == 'daily' && vars.BACKUP_RETENTION_ENABLED == 'true'
        shell: bash
        run: |
          node supabase/tests/backup-retention.mjs --preview > "$RUNNER_TEMP/retention.json"
          approval=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).approval_hash)' "$RUNNER_TEMP/retention.json")
          node supabase/tests/backup-retention.mjs --apply "$approval"
      - name: Report backup failure
        if: failure()
        run: echo "::error::Backup/export failed. Inspect this run; pending draft checkpoints will retry. Check GitHub Actions notification preferences."
