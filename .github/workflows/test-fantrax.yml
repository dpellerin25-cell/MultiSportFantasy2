name: Update Fantrax Standings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Fantrax standings
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python scripts/fetch_fantrax.py

      - name: Save updated standings to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add standings.json
          git diff --staged --quiet || git commit -m "Update Fantrax standings"
          git push
