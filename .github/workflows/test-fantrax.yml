name: Update Fantrax Data

on:
  workflow_dispatch:
    inputs:
      data:
        description: Data to refresh manually
        type: choice
        default: rosters
        options:
          - rosters
          - standings

  schedule:
    - cron: "0 9 * * *"
    - cron: "0 4 * * 2"
      timezone: "America/New_York"

concurrency:
  group: fantrax-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    env:
      UPDATE_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.data || (github.event.schedule == '0 4 * * 2' && 'standings' || 'rosters') }}

    steps:
      - name: Get repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch scheduled Fantrax data
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: python scripts/fetch_fantrax.py --only "$UPDATE_DATA"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/data/

          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Fantrax data"
            git push
          fi

      # Public roster refresh remains independent of the database connection.
      # Standings-only runs never import roster files into Supabase.
      - name: Report trade roster sync not configured
        if: env.UPDATE_DATA == 'rosters' && vars.TRADE_ROSTER_SYNC_ENABLED != 'true'
        run: echo "::warning::Trade roster database sync is disabled. Configure the documented project variables and secrets to enable daily reconciliation."

      - name: Set up Node for trade roster sync
        if: env.UPDATE_DATA == 'rosters' && vars.TRADE_ROSTER_SYNC_ENABLED == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install locked importer dependencies
        if: env.UPDATE_DATA == 'rosters' && vars.TRADE_ROSTER_SYNC_ENABLED == 'true'
        working-directory: supabase/tests
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts

      - name: Sync fresh rosters and reconcile accepted trades
        if: env.UPDATE_DATA == 'rosters' && vars.TRADE_ROSTER_SYNC_ENABLED == 'true'
        working-directory: supabase/tests
        env:
          TRADE_ROSTER_PROJECT_REF: ${{ vars.TRADE_ROSTER_PROJECT_REF }}
          TRADE_ROSTER_DATABASE_URL: ${{ secrets.TRADE_ROSTER_DATABASE_URL }}
          TRADE_ROSTER_CA_CERT: ${{ secrets.TRADE_ROSTER_CA_CERT }}
        run: node sync-trade-rosters.mjs --import
