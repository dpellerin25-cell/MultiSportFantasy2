name: Update Fantrax Data

on:
  workflow_dispatch:
    inputs:
      data:
        description: Data to refresh manually
        type: choice
        default: rosters
        options:
          - rosters
          - standings

  schedule:
    - cron: "0 9 * * *"
    - cron: "0 4 * * 2"
      timezone: "America/New_York"

concurrency:
  group: fantrax-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch scheduled Fantrax data
        env:
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
          UPDATE_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.data || (github.event.schedule == '0 4 * * 2' && 'standings' || 'rosters') }}
        run: python scripts/fetch_fantrax.py --only "$UPDATE_DATA"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/data/

          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Fantrax data"
            git push
          fi
